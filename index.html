<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0C1210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Yard" />
  <title>Yard — shipyard for EVM builders</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-kicker">SLICE 1 PROTOTYPE</div>
      <h1>YARD</h1>
      <p>Claim your ships.</p>
      <button class="btn btn-primary" id="btn-gh">Continue with GitHub</button>
      <button class="btn btn-ghost" id="btn-wallet">Continue with wallet</button>
      <button class="btn btn-ghost" id="btn-apple">Apple / Google</button>
      <p class="gate-note">Mock login. Signs you in as 0xMaya and backfills three deploys.</p>
    </div>
  </main>
  <div id="app" class="app hidden">
    <nav class="rail" aria-label="Desktop">
      <div class="logo">Y</div>
      <button data-nav="home">Home</button>
      <button data-nav="yard">Yard</button>
      <button data-nav="ships">Ships</button>
      <button data-nav="people">People</button>
      <button data-nav="launch">Launch</button>
      <button data-nav="diligence">Dili.</button>
      <button data-nav="messages">Msgs</button>
      <div class="spacer"></div>
      <button data-nav="me">Me</button>
    </nav>
    <div class="main">
      <header class="topbar">
        <input class="search" placeholder="Search ships, people, 0x…, tx hash" />
        <button class="chip hidden" id="queue-chip" data-act="open-publish"></button>
      </header>
      <div class="inner-nav hidden" id="inner-nav">
        <button data-yard="overview">Overview</button>
        <button data-yard="board" class="on">Board</button>
        <button data-yard="repos">Repos</button>
        <button data-yard="room">Room</button>
        <button data-yard="window">Window</button>
        <button data-yard="people">People</button>
      </div>
      <div class="workspace">
        <section class="canvas" id="canvas"></section>
        <aside class="drawer" id="drawer"></aside>
      </div>
    </div>
  </div>
  <nav class="tabbar" aria-label="Phone">
    <button data-phone="feed" class="on">Feed</button>
    <button data-phone="watch">Watch</button>
    <button data-phone="launch">Launch</button>
    <button data-phone="crew">Crew</button>
    <button data-phone="card">Card</button>
  </nav>
  <div id="toast" class="toast hidden"></div>
  <div id="modal-bg" class="modal-bg hidden">
    <div class="modal">
      <h3>Publish Ship Event?</h3>
      <p>vault-v2 v2.1.0 on Base. This hits the public feed and notifies Watchers.</p>
      <button class="btn btn-primary" data-act="confirm-publish">Publish</button>
      <button class="btn btn-ghost" data-act="cancel">Keep private</button>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
